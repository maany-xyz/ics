syntax = "proto3";

package interchain_security.consumergov.v1;

import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto"; // Ensure this import exists

option go_package = "github.com/maany-xyz/ics/v5/x/ccv/provider/consumergov/types";

// Define the Msg service
service Msg {
  option (cosmos.msg.v1.service) = true;

  // ConsumerGovProposal creates a new governance proposal.
  rpc ConsumerGovProposal(MsgConsumerGovProposal) returns (MsgConsumerGovProposalResponse);
}

// MsgConsumerGovProposal is a governance proposal that affects the DEX consumer chain.
message MsgConsumerGovProposal {
  option (cosmos.msg.v1.signer) = "authority";

  string title = 1;
  string description = 2;
  string consumer_id = 3; // The consumer chain ID this proposal applies to
  string action = 4; // Type of governance action (param_update, software_upgrade, etc.)
  bytes payload = 5; // Encoded governance action parameters
  string authority = 6 [(cosmos_proto.scalar) = "cosmos.AddressString"];

}

// Define the response message
message MsgConsumerGovProposalResponse {}
